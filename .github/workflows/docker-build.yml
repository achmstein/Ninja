name: Build and Push Docker Images

# Two ways in. A pushed tag like v2026.09.21 is a release: every image is
# built and carries that tag (and latest), so the control plane can offer it
# as one version all twelve services share. A manual run builds the services
# named (or all) with the commit's sha and latest, for work in progress.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to build (comma-separated, or "all")'
        required: false
        default: 'all'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/ninja

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      catalog: ${{ steps.changes.outputs.catalog }}
      spaces: ${{ steps.changes.outputs.spaces }}
      sales: ${{ steps.changes.outputs.sales }}
      inventory: ${{ steps.changes.outputs.inventory }}
      payroll: ${{ steps.changes.outputs.payroll }}
      finance: ${{ steps.changes.outputs.finance }}
      ordering: ${{ steps.changes.outputs.ordering }}
      identity: ${{ steps.changes.outputs.identity }}
      loyalty: ${{ steps.changes.outputs.loyalty }}
      notification: ${{ steps.changes.outputs.notification }}
      accounts: ${{ steps.changes.outputs.accounts }}
      branch: ${{ steps.changes.outputs.branch }}
      control: ${{ steps.changes.outputs.control }}
      shared: ${{ steps.changes.outputs.shared }}
    steps:
      - uses: actions/checkout@v4

      # A release builds everything, so nothing is compared; the job still
      # succeeds so the build jobs run
      - name: Detect changes
        if: github.ref_type != 'tag'
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            catalog:
              - 'src/Catalog.API/**'
            spaces:
              - 'src/Spaces.API/**'
              - 'src/Spaces.Domain/**'
              - 'src/Spaces.Infrastructure/**'
            sales:
              - 'src/Sales.API/**'
              - 'src/Sales.Domain/**'
              - 'src/Sales.Infrastructure/**'
            inventory:
              - 'src/Inventory.API/**'
              - 'src/Inventory.Domain/**'
              - 'src/Inventory.Infrastructure/**'
            payroll:
              - 'src/Payroll.API/**'
              - 'src/Payroll.Domain/**'
              - 'src/Payroll.Infrastructure/**'
            finance:
              - 'src/Finance.API/**'
              - 'src/Finance.Domain/**'
              - 'src/Finance.Infrastructure/**'
            ordering:
              - 'src/Ordering.API/**'
              - 'src/Ordering.Domain/**'
              - 'src/Ordering.Infrastructure/**'
            identity:
              - 'src/Identity.API/**'
            loyalty:
              - 'src/Loyalty.API/**'
            notification:
              - 'src/Notification.API/**'
            accounts:
              - 'src/Accounts.API/**'
              - 'src/Accounts.Domain/**'
              - 'src/Accounts.Infrastructure/**'
            branch:
              - 'src/Branch.API/**'
            control:
              - 'src/Control.API/**'
            shared:
              - 'src/Ninja.ServiceDefaults/**'
              - 'src/EventBus/**'
              - 'src/EventBusRabbitMQ/**'
              - 'src/IntegrationEventLogEF/**'
              - 'src/Shared/**'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'

  build-catalog:
    needs: detect-changes
    if: |
      github.ref_type == 'tag' ||
      github.event_name == 'workflow_dispatch' && (github.event.inputs.services == 'all' || contains(github.event.inputs.services, 'catalog')) ||
      github.event_name != 'workflow_dispatch' && (needs.detect-changes.outputs.catalog == 'true' || needs.detect-changes.outputs.shared == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-catalog
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/Catalog.API/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

