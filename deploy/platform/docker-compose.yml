# The Ninja platform: what every tenant shares, plus the control plane.
# Tenant stacks are separate compose projects (ninja-{slug}) that the
# control plane stamps into /opt/ninja/tenants/{slug} and joins to the
# `aspire` network declared here.
#
#   docker compose up -d        (project name: ninja)
#
# Fill .env from .env.example. Wildcard DNS for PLATFORM_DOMAIN must point
# here before the first tenant; see deploy/platform/README.md.

name: ninja

services:
  postgres:
    image: docker.io/ankane/pgvector:latest
    restart: unless-stopped
    # Every stack opens eleven pools (Maximum Pool Size=20 each, stamped into its compose) and Keycloak its own:
    # the default 100 connections are gone by the fifth café. The control plane counts against this number.
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-400}", "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS:-1GB}"]
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY:-3G}
    environment:
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Keycloak cannot create its own database; the control plane creates the tenants'
      POSTGRES_MULTIPLE_DATABASES: keycloak,controldb
      # The control plane's own role: owns controldb and nothing else (the superuser stays for stamping tenants)
      CONTROL_DB_PASSWORD: ${CONTROL_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
      - ./control-role.sh:/docker-entrypoint-initdb.d/zz-control-role.sh:ro
    networks: [aspire]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  eventbus:
    image: docker.io/library/rabbitmq:4.2
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${EVENTBUS_MEMORY:-1G}
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: ${EVENTBUS_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [aspire]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    restart: unless-stopped
    command: ["start", "--import-realm"]
    deploy:
      resources:
        limits:
          memory: ${KEYCLOAK_MEMORY:-1536M}
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD}
      # /health/ready on the management port (9000), which the control plane's own /health asks
      KC_HEALTH_ENABLED: "true"
      KC_DB_POOL_MAX_SIZE: "20"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_FEATURES: token-exchange,admin-fine-grained-authz:v1
      KC_HOSTNAME: https://auth.${PLATFORM_DOMAIN}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Realms and users in Postgres, not the dev-mode H2 the single stack ran on
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # The platform realm (ninja) on first boot; tenant realms are created by the control plane
      - ./realms:/opt/keycloak/data/import:ro
      # The login theme every realm uses (the deploy workflow copies it from the AppHost's folder)
      - ./themes/ninja:/opt/keycloak/themes/ninja:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [aspire]

  control-api:
    image: ${IMAGE_REGISTRY:-ghcr.io/achmstein/ninja}-control:${IMAGE_TAG:-latest}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${CONTROL_MEMORY:-768M}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "8080"
      ConnectionStrings__controldb: Host=postgres;Port=5432;Username=control;Password=${CONTROL_DB_PASSWORD};Database=controldb
      Identity__Url: http://keycloak:8080/realms/ninja
      Keycloak__Realm: ninja
      Platform__Domain: ${PLATFORM_DOMAIN}
      Platform__ControlUrl: https://control.${PLATFORM_DOMAIN}
      Platform__TenantsRoot: /opt/ninja/tenants
      Platform__ImageRegistry: ${IMAGE_REGISTRY:-ghcr.io/achmstein/ninja}
      Platform__DefaultImageTag: ${IMAGE_TAG:-latest}
      Platform__Registry__User: ${REGISTRY_USER:-}
      Platform__Registry__Token: ${REGISTRY_TOKEN:-}
      Platform__PostgresPassword: ${POSTGRES_PASSWORD}
      Platform__RabbitPassword: ${EVENTBUS_PASSWORD}
      Platform__KeycloakPublicUrl: https://auth.${PLATFORM_DOMAIN}
      # Its own master-realm user (the deploy workflow creates it), so the bootstrap admin can be rotated on its own
      Platform__KeycloakAdminUser: ${KEYCLOAK_CONTROL_USER:-platform-control}
      Platform__KeycloakAdminPassword: ${KEYCLOAK_CONTROL_PASSWORD}
      # What the tenants' secrets are encrypted under in controldb: openssl rand -base64 32; lose it and every stack's passwords go with it
      Platform__EncryptionKey: ${PLATFORM_ENCRYPTION_KEY}
      Platform__GeminiApiKey: ${GEMINI_API_KEY}
      # What the capacity guard counts against (the same number as the postgres command above) and the pool each service is stamped with
      Platform__PostgresMaxConnections: ${POSTGRES_MAX_CONNECTIONS:-400}
      Platform__ServicePoolSize: ${SERVICE_POOL_SIZE:-20}
      Platform__ServiceConnectionsEstimate: ${SERVICE_CONNECTIONS_ESTIMATE:-4}
      # The floor on the tenants drive: below it no backup, no stamp, and a mail to ops
      Platform__MinFreeDiskMb: ${MIN_FREE_DISK_MB:-5120}
      # Which plans' stacks get the assistant key (a demo always does); a comma list of Free, Starter, Pro
      Platform__AssistantPlans__0: ${ASSISTANT_PLAN_0:-Pro}
      # A copy of every backup off the box, into any S3-compatible bucket; off until a bucket and keys are set
      Platform__Offsite__Endpoint: ${OFFSITE_ENDPOINT:-}
      Platform__Offsite__Bucket: ${OFFSITE_BUCKET:-}
      Platform__Offsite__AccessKey: ${OFFSITE_ACCESS_KEY:-}
      Platform__Offsite__SecretKey: ${OFFSITE_SECRET_KEY:-}
      Platform__Offsite__Region: ${OFFSITE_REGION:-auto}
      Platform__Offsite__Prefix: ${OFFSITE_PREFIX:-}
      # The weekly restore drill needs a stack's worth of memory for ten minutes
      Platform__RestoreDrill__Enabled: ${RESTORE_DRILL_ENABLED:-false}
      # Mail to owners and to whoever runs the platform, through any SMTP; off (and audited as skipped) until a host is set
      Platform__Mail__Host: ${MAIL_HOST:-}
      Platform__Mail__Port: ${MAIL_PORT:-587}
      Platform__Mail__User: ${MAIL_USER:-}
      Platform__Mail__Password: ${MAIL_PASSWORD:-}
      Platform__Mail__From: ${MAIL_FROM:-no-reply@${PLATFORM_DOMAIN}}
      Platform__Mail__FromName: Ninja
      Platform__Mail__OpsTo: ${MAIL_OPS_TO:-}
    volumes:
      # Stamps stacks with the host's docker; the tenants folder must be the
      # same path inside and out because compose reads the files from the host
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/ninja/tenants:/opt/ninja/tenants
      # The custom-domain sites it writes for Caddy
      - ./custom-domains.caddy:/opt/ninja/platform/custom-domains.caddy
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks: [aspire]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${CADDY_MEMORY:-256M}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN}
      PLATFORM_SLUG_LABEL: ${PLATFORM_SLUG_LABEL:-2}
      ACME_EMAIL: ${ACME_EMAIL}
      # Where the Keycloak admin console may be opened from (space-separated networks); nowhere until set
      ADMIN_ALLOW_CIDR: ${ADMIN_ALLOW_CIDR:-127.0.0.1/32}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./custom-domains.caddy:/etc/caddy/custom-domains.caddy:ro
      - ./web/admin-web:/srv/admin-web:ro
      - ./web/client-web:/srv/client-web:ro
      - ./web/pos-web:/srv/pos-web:ro
      - ./web/kds-web:/srv/kds-web:ro
      - ./web/control-web:/srv/control-web:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      control-api:
        condition: service_healthy
    networks: [aspire]

networks:
  aspire:
    name: aspire
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data:
  caddy-data:
  caddy-config:
