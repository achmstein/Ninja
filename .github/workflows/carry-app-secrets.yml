name: Carry App Secrets

# Once per business whose own app was set up before the control plane kept it:
# what its GitHub environment app-<slug> holds goes onto its record (the App tab
# of its page), so its builds read it from there (tenants/fetch-kit.sh). Only
# empty slots are filled; anything already set on the record is kept. The
# environment's secrets stay as they are, a fallback, until deleted by hand.

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: 'The business whose environment app-<slug> is carried'
        required: true
        type: string

jobs:
  carry:
    runs-on: ubuntu-latest
    environment: app-${{ inputs.tenant }}
    steps:
      - name: Carry
        env:
          TENANT: ${{ inputs.tenant }}
          APP_BUILDER_SECRET: ${{ secrets.APP_BUILDER_SECRET }}
          PLATFORM_DOMAIN: ${{ vars.PLATFORM_DOMAIN }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if ! [[ "$TENANT" =~ ^[a-z0-9]([a-z0-9]|-[a-z0-9]){2,23}$ ]]; then
            echo "::error::'$TENANT' is not a business's slug"; exit 1
          fi
          if [ -z "$APP_BUILDER_SECRET" ] || [ -z "$PLATFORM_DOMAIN" ]; then
            echo "::error::Set APP_BUILDER_SECRET and the variable PLATFORM_DOMAIN"; exit 1
          fi
          token=$(curl -sS --fail-with-body --max-time 30 \
            -d grant_type=client_credentials -d client_id=app-builder --data-urlencode "client_secret=$APP_BUILDER_SECRET" \
            "https://auth.$PLATFORM_DOMAIN/realms/ninja/protocol/openid-connect/token" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["access_token"])')
          echo "::add-mask::$token"
          # The body is made from the variables, never echoed
          python3 - > "$RUNNER_TEMP/carry.json" <<'PY'
          import json, os
          e = lambda k: (os.environ.get(k) or "").strip() or None
          print(json.dumps({
            "keystore": "".join((e("ANDROID_KEYSTORE_BASE64") or "").split()) or None,
            "keyAlias": e("ANDROID_KEY_ALIAS"),
            "keyPassword": e("ANDROID_KEY_PASSWORD"),
            "storePassword": e("ANDROID_STORE_PASSWORD"),
            "playServiceAccountJson": e("PLAY_STORE_SERVICE_ACCOUNT_JSON"),
            "ascKeyId": e("APP_STORE_CONNECT_API_KEY_ID"),
            "ascIssuerId": e("APP_STORE_CONNECT_API_ISSUER_ID"),
            "ascPrivateKey": e("APP_STORE_CONNECT_API_PRIVATE_KEY"),
            "googleServicesJson": e("GOOGLE_SERVICES_JSON"),
            "googleServiceInfoPlist": e("GOOGLE_SERVICE_INFO_PLIST"),
          }))
          PY
          code=$(curl -sS --max-time 60 -o "$RUNNER_TEMP/answer.json" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/carry.json" \
            "https://control.$PLATFORM_DOMAIN/api/control/tenants/$TENANT/app-kit/carry")
          rm -f "$RUNNER_TEMP/carry.json"
          echo "The control plane answered $code:"
          cat "$RUNNER_TEMP/answer.json"; echo
          [ "$code" = "200" ]
