name: Initialize Fastlane Match

# A business's iOS distribution certificate and App Store profiles, in its
# branch of the certificates repo, ahead of its first build (which would make
# them itself). Run again to add what is missing; what is there is kept.
# Everything comes from the business's environment app-<slug>, its record on
# the control plane and the shared MATCH_* settings, as the build's do
# (tenants/README.md).

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: 'The business whose own app is signed: its slug'
        required: true
        default: chillax
        type: string

env:
  TENANT: ${{ inputs.tenant }}

jobs:
  init-match-client:
    runs-on: macos-latest
    environment: app-${{ inputs.tenant }}
    defaults:
      run:
        working-directory: src/client_app/ios
    steps:
      - uses: actions/checkout@v4

      # The app's id and Apple team, as the build is told them
      - name: Fetch the business's record
        working-directory: src/client_app
        env:
          APP_BUILDER_SECRET: ${{ secrets.APP_BUILDER_SECRET }}
          PLATFORM_DOMAIN: ${{ vars.PLATFORM_DOMAIN }}
        run: |
          bash ../../tenants/fetch-record.sh "$TENANT"
          python3 - "../../tenants/$TENANT.json" >> "$GITHUB_ENV" <<'EOF'
          import json, sys
          record = json.load(open(sys.argv[1]))
          if not record.get('APP_ID') or not record.get('APPLE_TEAM_ID'):
              sys.exit(f"{sys.argv[1]} has no APP_ID or APPLE_TEAM_ID: set Own customer app and Apple team ID on the control plane")
          print(f"APP_ID={record['APP_ID']}")
          print(f"APPLE_TEAM_ID={record['APPLE_TEAM_ID']}")
          EOF

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: src/client_app/ios

      - name: Create App Store Connect API key
        env:
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          API_KEY_PATH=$RUNNER_TEMP/api_key.json
          ESCAPED_KEY=$(echo "$APP_STORE_CONNECT_API_PRIVATE_KEY" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read())[1:-1])")
          cat > "$API_KEY_PATH" <<EOF
          {
            "key_id": "$APP_STORE_CONNECT_API_KEY_ID",
            "issuer_id": "$APP_STORE_CONNECT_API_ISSUER_ID",
            "key": "$ESCAPED_KEY",
            "in_house": false
          }
          EOF
          echo "API_KEY_PATH=$API_KEY_PATH" >> $GITHUB_ENV

      # The business's branch of the one certificates repo and its derived
      # passphrase, as the build uses them (tenants/match-env.sh)
      - name: Signing settings
        working-directory: src/client_app
        env:
          MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL }}
          MATCH_MASTER_KEY: ${{ secrets.MATCH_MASTER_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          if [ -z "$MATCH_GIT_URL" ]; then echo "::error::Set the repository variable MATCH_GIT_URL (the certificates repo)"; exit 1; fi
          bash ../../tenants/match-env.sh "$TENANT"

      # The lane the build runs first: reads what the branch holds and makes
      # what is missing (the Fastfile says how)
      - name: Run Match (client_app)
        env:
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane certificates
