name: Deploy to Server

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/ninja

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Aspire CLI
        run: dotnet tool install --global aspire.cli --prerelease

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build web apps
        env:
          # Keycloak's dedicated production host
          VITE_KEYCLOAK_URL: https://auth.chillax.site
          VITE_KEYCLOAK_REALM: chillax
          # Firebase web push for admin_web (the owner's digest) and client_web
          # (notify-me). Empty secrets leave push off; nothing else changes.
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_WEB_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_WEB_PROJECT_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_WEB_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.FIREBASE_WEB_VAPID_KEY }}
        run: |
          cd src/admin_web
          npm ci
          npm run build
          cd ../client_web
          npm ci
          npm run build
          cd ../pos_web
          npm ci
          npm run build
          cd ../kds_web
          npm ci
          npm run build

      - name: Generate Docker Compose artifacts
        env:
          Parameters__postgres_password: postgres
          Parameters__eventbus_password: guest
          Parameters__keycloak_password: admin
          # Resolved so publish never waits on a prompt; the .env still gets an empty placeholder, filled below
          Parameters__gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd src/Ninja.AppHost
          aspire publish -o ../../deploy-artifacts

      - name: Prepare deployment artifacts
        run: |
          cp src/Ninja.AppHost/KeycloakConfiguration/realms/chillax-realm.json deploy-artifacts/chillax-realm.json
          sed -i 's|source: ".*KeycloakConfiguration/realms"|source: "./chillax-realm.json"|g' deploy-artifacts/docker-compose.yaml
          sed -i 's|target: "/opt/keycloak/data/import"|target: "/opt/keycloak/data/import/chillax-realm.json"|g' deploy-artifacts/docker-compose.yaml

          # Keycloak login theme travels the same way as the realm file
          cp -r src/Ninja.AppHost/KeycloakConfiguration/themes deploy-artifacts/keycloak-themes
          sed -i 's|source: ".*KeycloakConfiguration/themes/ninja"|source: "./keycloak-themes/ninja"|g' deploy-artifacts/docker-compose.yaml

          # Aspire publish emits no restart policy on infrastructure services (postgres,
          # keycloak, eventbus, mobile-bff, pgadmin), which defaults to "no" — they stay
          # exited after a host reboot while the app services come back. Force them to
          # restart unless explicitly stopped.
          for svc in postgres keycloak eventbus mobile-bff pgadmin; do
            sed -i "/^  ${svc}:$/a\    restart: \"unless-stopped\"" deploy-artifacts/docker-compose.yaml
          done

          # The nightly backup script and its restore runbook live beside the compose file
          cp deploy/backup.sh deploy-artifacts/backup.sh
          cp deploy/restore.md deploy-artifacts/restore.md

          # Copy Caddy files for TLS termination
          cp deploy/docker-compose.caddy.yml deploy-artifacts/docker-compose.caddy.yml
          cp deploy/Caddyfile deploy-artifacts/Caddyfile
          cp -r deploy/website deploy-artifacts/website

          # Static web app bundles served by Caddy
          cp -r src/admin_web/dist deploy-artifacts/admin-web
          cp -r src/client_web/dist deploy-artifacts/client-web
          cp -r src/pos_web/dist deploy-artifacts/pos-web
          cp -r src/kds_web/dist deploy-artifacts/kds-web

          # Fill empty .env values (aspire publish generates empty placeholders)
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=postgres/' deploy-artifacts/.env
          sed -i 's/^EVENTBUS_PASSWORD=$/EVENTBUS_PASSWORD=guest/' deploy-artifacts/.env
          sed -i 's/^KEYCLOAK_PASSWORD=$/KEYCLOAK_PASSWORD=admin/' deploy-artifacts/.env

          # The AI assistant's key: the AppHost's gemini-api-key parameter
          # (Gemini, or any OpenAI-compatible provider named in
          # src/Ninja.AppHost/appsettings.json). An empty secret trips the
          # guard below on purpose: ship without AI by choice, not by accident.
          sed -i 's|^GEMINI_API_KEY=$|GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}|' deploy-artifacts/.env

          # Fill port values for service discovery
          sed -i 's/^CATALOG_API_PORT=$/CATALOG_API_PORT=8080/' deploy-artifacts/.env
          sed -i 's/^ORDERING_API_PORT=$/ORDERING_API_PORT=8080/' deploy-artifacts/.env
          sed -i 's/^SPACES_API_PORT=$/SPACES_API_PORT=8080/' deploy-artifacts/.env
          sed -i 's/^IDENTITY_API_PORT=$/IDENTITY_API_PORT=8080/' deploy-artifacts/.env
          sed -i 's/^LOYALTY_API_PORT=$/LOYALTY_API_PORT=8080/' deploy-artifacts/.env
          sed -i 's/^NOTIFICATION_API_PORT=$/NOTIFICATION_API_PORT=8080/' deploy-artifacts/.env
          sed -i 's/^ACCOUNTS_API_PORT=$/ACCOUNTS_API_PORT=8080/' deploy-artifacts/.env
          sed -i 's/^BRANCH_API_PORT=$/BRANCH_API_PORT=8080/' deploy-artifacts/.env
          sed -i 's/^SALES_API_PORT=$/SALES_API_PORT=8080/' deploy-artifacts/.env
          sed -i 's/^INVENTORY_API_PORT=$/INVENTORY_API_PORT=8080/' deploy-artifacts/.env
          sed -i 's/^PAYROLL_API_PORT=$/PAYROLL_API_PORT=8080/' deploy-artifacts/.env
          sed -i 's/^FINANCE_API_PORT=$/FINANCE_API_PORT=8080/' deploy-artifacts/.env
          sed -i 's/^MOBILE_BFF_PORT=$/MOBILE_BFF_PORT=5000/' deploy-artifacts/.env

          # Aspire also emits an empty *_API_IMAGE per service. The compose file
          # names the images itself, so these are unused today; fill them with
          # the same references so the guard below passes and they are right
          # should a future Aspire start reading them.
          for svc in catalog ordering spaces sales inventory payroll finance identity loyalty notification accounts branch; do
            upper=$(echo "$svc" | tr a-z A-Z)
            sed -i "s|^${upper}_API_IMAGE=$|${upper}_API_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${svc}:latest|" deploy-artifacts/.env
          done

          # A placeholder left empty becomes `expose: - ""`, and compose aborts
          # the whole rollout half-way (2026-09-09: postgres recreated, APIs
          # not). Refuse to ship an .env with any empty value.
          if grep -qE '^[A-Z_]+=$' deploy-artifacts/.env; then
            echo "ERROR: unfilled .env placeholders:"; grep -E '^[A-Z_]+=$' deploy-artifacts/.env
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deploy-artifacts
          path: deploy-artifacts/

      - name: Copy deployment files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "deploy-artifacts/*"
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 1

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,FIREBASE_CREDENTIALS_JSON
          script: |
            # A failed pull or `up` must fail the deploy, not report success
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            # Write Firebase credentials
            echo "$FIREBASE_CREDENTIALS_JSON" > firebase-credentials.json
            chmod 600 firebase-credentials.json

            # Login to GHCR
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Pull pre-built images and build any Aspire-generated services (e.g. mobile-bff)
            docker compose -f docker-compose.yaml -f docker-compose.caddy.yml pull --ignore-buildable
            docker compose -f docker-compose.yaml -f docker-compose.caddy.yml up -d --build --remove-orphans

            # Dead-lettering for the queues that predate it: a queue's
            # arguments are fixed at its first declaration, so the broker
            # policy is what covers the old ones (new queues declare it
            # themselves - RabbitMQEventBus.DeclareQueueAsync). Idempotent;
            # the node may still be booting right after a recreate.
            for i in $(seq 1 12); do
              docker compose -f docker-compose.yaml -f docker-compose.caddy.yml exec -T eventbus \
                rabbitmqctl set_policy dead-letter ".*" '{"dead-letter-exchange":"ninja_dead_letters"}' --apply-to queues \
                && break
              [ "$i" -eq 12 ] && { echo "ERROR: could not set the dead-letter policy"; exit 1; }
              sleep 5
            done

            # The Caddyfile is a single-file bind mount: scp replaces it with a
            # new inode, so the running container keeps seeing the OLD file and
            # a `caddy reload` inside it reloads stale config. Recreating the
            # container re-resolves the mount to the new file (~2s blip).
            docker compose -f docker-compose.yaml -f docker-compose.caddy.yml up -d --force-recreate caddy

            # The nightly backup (deploy/backup.sh): 05:15 UTC is 08:15 in
            # Cairo, after the overnight shift has closed. Installed on every
            # deploy so the crontab line always matches the shipped script;
            # backup.yml checks the result each morning.
            chmod +x backup.sh
            mkdir -p backups
            ( crontab -l 2>/dev/null | grep -v 'chillax-backup' ;               echo "15 5 * * * cd $(pwd) && ./backup.sh >> $(pwd)/backups/backup.log 2>&1 # chillax-backup" ) | crontab -

            # Cleanup old images
            docker image prune -f

            # Show running containers
            docker compose -f docker-compose.yaml -f docker-compose.caddy.yml ps

      # The deploy is not done until the site answers. Each API's /health
      # (database + event bus + self, through Caddy and the BFF), the three
      # web apps and Keycloak; the services migrate on start, so give them
      # a few minutes. A failure here fails the run - the alert that was
      # missing on 2026-09-09.
      - name: Smoke-test the deployment
        run: |
          set -e
          check() {
            local url="$1" tries="${2:-36}"
            for i in $(seq 1 "$tries"); do
              body=$(curl -sS --max-time 10 -w '\n%{http_code}' "$url" 2>/dev/null || true)
              code=$(echo "$body" | tail -1)
              if [ "$code" = "200" ]; then echo "ok   $url"; return 0; fi
              sleep 5
            done
            echo "::error::FAIL $url -> HTTP ${code:-none} ($(echo "$body" | head -1 | cut -c1-120))"
            return 1
          }
          failed=0
          for svc in catalog ordering spaces sales inventory payroll finance identity loyalty notification accounts branch; do
            check "https://api.chillax.site/health/$svc" || failed=1
          done
          for host in app admin pos kds; do
            check "https://$host.chillax.site/" 6 || failed=1
          done
          check "https://auth.chillax.site/realms/chillax" 6 || failed=1
          [ "$failed" = 0 ] || { echo "::error::smoke test failed - see above"; exit 1; }

      - name: Setup Keycloak token exchange
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e

            DEPLOY_DIR="${{ secrets.DEPLOY_PATH }}"
            REALM="chillax"
            CLIENT_ID="mobile-app"
            KC="/opt/keycloak/bin/kcadm.sh"

            # Find the keycloak container
            CONTAINER=$(docker compose -f "$DEPLOY_DIR/docker-compose.yaml" -f "$DEPLOY_DIR/docker-compose.caddy.yml" ps -q keycloak 2>/dev/null || docker compose -f "$DEPLOY_DIR/docker-compose.yml" ps -q keycloak 2>/dev/null)
            if [ -z "$CONTAINER" ]; then
              echo "ERROR: Keycloak container not found"
              exit 1
            fi
            echo "Keycloak container: $CONTAINER"

            # Read admin password from deploy .env
            KC_PASSWORD=$(grep -oP '^KEYCLOAK_PASSWORD=\K.*' "$DEPLOY_DIR/.env" 2>/dev/null || echo "admin")

            # Wait for Keycloak to be ready
            echo "Waiting for Keycloak to be ready..."
            for i in $(seq 1 30); do
              if docker exec "$CONTAINER" $KC config credentials \
                --server http://localhost:8080 --realm master --user admin --password "$KC_PASSWORD" > /dev/null 2>&1; then
                echo "  Keycloak is ready and authenticated"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "ERROR: Keycloak not ready after 30 attempts"
                exit 1
              fi
              echo "  Attempt $i/30 - waiting 5s..."
              sleep 5
            done

            echo ""
            echo "=== Apply realm settings ==="
            # The realm import only runs on first boot, so enforce these on
            # the existing realm every deploy (idempotent). The theme is the
            # platform's one for every realm; the HTML display name is the
            # café's mark on its login page. Long SSO sessions (30d idle /
            # 90d max) keep web users signed in.
            docker exec "$CONTAINER" $KC update "realms/$REALM" \
              -s loginTheme=ninja \
              -s 'displayNameHtml=<img src="https://api.chillax.site/api/tenant/icons/icon-192.png" alt="">' \
              -s internationalizationEnabled=true \
              -s 'supportedLocales=["en","ar"]' \
              -s defaultLocale=en \
              -s registrationEmailAsUsername=true \
              -s 'passwordPolicy=length(6)' \
              -s ssoSessionIdleTimeout=2592000 \
              -s ssoSessionMaxLifespan=7776000 && \
              echo "  Theme, locales, registration + session lifetimes applied"

            echo ""
            echo "=== Enable permissions on identity providers ==="
            for IDP_ALIAS in google apple; do
              echo "Enabling permissions for $IDP_ALIAS..."
              docker exec "$CONTAINER" $KC update "identity-provider/instances/$IDP_ALIAS/management/permissions" \
                -r $REALM -s enabled=true 2>/dev/null && \
                echo "  Permissions enabled for $IDP_ALIAS" || \
                echo "  Permissions already enabled or IdP not found for $IDP_ALIAS"
            done

            echo ""
            echo "=== Get realm-management and mobile-app client IDs ==="
            REALM_MGMT_ID=$(docker exec "$CONTAINER" $KC get clients \
              -r $REALM --fields id,clientId | \
              python3 -c "import sys,json; clients=json.load(sys.stdin); print(next(c['id'] for c in clients if c['clientId']=='realm-management'))")
            echo "  realm-management ID: $REALM_MGMT_ID"

            MOBILE_APP_ID=$(docker exec "$CONTAINER" $KC get clients \
              -r $REALM --fields id,clientId | \
              python3 -c "import sys,json; clients=json.load(sys.stdin); print(next(c['id'] for c in clients if c['clientId']=='$CLIENT_ID'))")
            echo "  mobile-app ID: $MOBILE_APP_ID"

            echo ""
            echo "=== Get or create mobile-app-policy ==="
            POLICY_ID=$(docker exec "$CONTAINER" $KC get \
              "clients/$REALM_MGMT_ID/authz/resource-server/policy/client" \
              -r $REALM --fields id,name 2>/dev/null | \
              python3 -c "
            import sys,json
            try:
              policies=json.load(sys.stdin)
              print(next(p['id'] for p in policies if p['name']=='mobile-app-policy'))
            except:
              print('')
            " 2>/dev/null || true)

            if [ -n "$POLICY_ID" ]; then
              echo "  Policy already exists: $POLICY_ID (skipping creation)"
            else
              echo "  Creating new client policy..."
              docker exec "$CONTAINER" $KC create \
                "clients/$REALM_MGMT_ID/authz/resource-server/policy/client" \
                -r $REALM \
                -s name=mobile-app-policy \
                -s description="Allow mobile-app client for token exchange" \
                -s logic=POSITIVE \
                -s "clients=[\"$MOBILE_APP_ID\"]"

              POLICY_ID=$(docker exec "$CONTAINER" $KC get \
                "clients/$REALM_MGMT_ID/authz/resource-server/policy/client" \
                -r $REALM --fields id,name | \
                python3 -c "
            import sys,json
            policies=json.load(sys.stdin)
            print(next(p['id'] for p in policies if p['name']=='mobile-app-policy'))
            ")
              echo "  Created policy: $POLICY_ID"
            fi

            echo ""
            echo "=== Assign policy to token-exchange permissions ==="
            for IDP_ALIAS in google apple; do
              # Query each IdP's permissions endpoint to get the exact permission ID
              PERM_ID=$(docker exec "$CONTAINER" $KC get \
                "identity-provider/instances/$IDP_ALIAS/management/permissions" \
                -r $REALM 2>/dev/null | \
                python3 -c "
            import sys,json
            try:
              data=json.load(sys.stdin)
              scopes = data.get('scopePermissions', {})
              print(scopes.get('token-exchange', ''))
            except:
              print('')
            " 2>/dev/null || true)

              if [ -n "$PERM_ID" ]; then
                echo "  Updating token-exchange permission for $IDP_ALIAS ($PERM_ID)..."
                docker exec "$CONTAINER" $KC update \
                  "clients/$REALM_MGMT_ID/authz/resource-server/permission/scope/$PERM_ID" \
                  -r $REALM \
                  -s "policies=[\"$POLICY_ID\"]" \
                  -s decisionStrategy=AFFIRMATIVE 2>/dev/null && \
                  echo "    Done" || echo "    Failed to update permission"
              else
                echo "  No token-exchange permission found for $IDP_ALIAS"
              fi
            done

            echo ""
            echo "=== Ensure realm roles exist ==="
            # Realm import only runs on a fresh volume; roles added to
            # chillax-realm.json later must be upserted here (idempotent)
            docker exec "$CONTAINER" $KC create roles -r $REALM \
              -s name=Cashier \
              -s description="Cashier role - runs the POS (sales, tickets, shifts) without back-office access" 2>/dev/null && \
              echo "  Created Cashier role" || echo "  Cashier role already exists"

            echo ""
            echo "=== Ensure the 'branches' client scope exists ==="
            # Staff clients carry the user's branch ids (user attribute 'branches')
            SCOPE_ID=$(docker exec "$CONTAINER" $KC get client-scopes -r $REALM --fields id,name | \
              python3 -c "import sys,json;s=json.load(sys.stdin);print(next((x['id'] for x in s if x['name']=='branches'),''))")
            if [ -z "$SCOPE_ID" ]; then
              docker exec "$CONTAINER" $KC create client-scopes -r $REALM \
                -s name=branches -s protocol=openid-connect \
                -s 'description=Branch ids a staff account may operate' \
                -s 'attributes."include.in.token.scope"=true' \
                -s 'attributes."display.on.consent.screen"=false' >/dev/null
              SCOPE_ID=$(docker exec "$CONTAINER" $KC get client-scopes -r $REALM --fields id,name | \
                python3 -c "import sys,json;s=json.load(sys.stdin);print(next(x['id'] for x in s if x['name']=='branches'))")
              docker exec "$CONTAINER" $KC create "client-scopes/$SCOPE_ID/protocol-mappers/models" -r $REALM \
                -s name=branches -s protocol=openid-connect -s protocolMapper=oidc-usermodel-attribute-mapper \
                -s 'config."user.attribute"=branches' -s 'config."claim.name"=branches' \
                -s 'config."jsonType.label"=String' -s 'config.multivalued=true' \
                -s 'config."id.token.claim"=true' -s 'config."access.token.claim"=true' \
                -s 'config."userinfo.token.claim"=true'
              echo "  Created branches scope"
            else
              echo "  branches scope exists"
            fi

            echo ""
            echo "=== Declare the 'branches' user attribute (admin-only) ==="
            # Managed and admin-only, so a user can never assign themselves a branch
            docker exec "$CONTAINER" $KC get users/profile -r $REALM | python3 -c '
            import sys,json
            p=json.load(sys.stdin); attrs=p.setdefault("attributes",[])
            if not any(a["name"]=="branches" for a in attrs):
                attrs.append({"name":"branches","displayName":"Branches","multivalued":True,
                  "validations":{"length":{"max":10},"pattern":{"pattern":"^[0-9]+$","error-message":"invalid-branch-id"}},
                  "permissions":{"view":["admin"],"edit":["admin"]}})
            json.dump(p,sys.stdout)' | \
              docker exec -i "$CONTAINER" $KC update users/profile -r $REALM -f - && echo "  User profile updated"

            echo ""
            echo "=== Shape the user profile like the app's registration form ==="
            # One Name field (firstName; lastName is admin-only), email and an
            # Egyptian mobile number, required of users but not of admins
            # creating staff. Email is NOT required here: registration already
            # needs one (email is the username), and Apple sign-in creates
            # accounts with no email field at all — a required email makes
            # every later profile write on those accounts fail. Idempotent.
            docker exec "$CONTAINER" $KC get users/profile -r $REALM | python3 -c '
            import sys,json
            p=json.load(sys.stdin)
            by={a["name"]:a for a in p["attributes"]}
            first=by["firstName"]; first["displayName"]="${name}"; first["required"]={"roles":["user"]}
            email=by["email"]; email.pop("required",None)
            email.setdefault("annotations",{})["inputType"]="html5-email"
            last=by["lastName"]; last.pop("required",None); last["permissions"]={"view":["admin"],"edit":["admin"]}
            phone=by.setdefault("phoneNumber",{"name":"phoneNumber","multivalued":False})
            phone.update({"displayName":"${phoneNumber}","required":{"roles":["user"]},
              "validations":{"pattern":{"pattern":"^01[0-9]{9}$","error-message":"invalidPhone"}},
              "annotations":{"inputType":"html5-tel","inputTypePlaceholder":"01xxxxxxxxx"},
              "permissions":{"view":["admin","user"],"edit":["admin","user"]}})
            order=["username","firstName","email","phoneNumber","lastName"]
            p["attributes"]=[by[n] for n in order]+[a for a in p["attributes"] if a["name"] not in order]
            json.dump(p,sys.stdout)' | \
              docker exec -i "$CONTAINER" $KC update users/profile -r $REALM -f - && echo "  User profile shaped"

            echo ""
            echo "=== Keep 'Verify Profile' off ==="
            # Required attributes bite at registration and profile edits only.
            # Enabled, this action would stop existing users who have no phone
            # at login, and the mobile app's password grant would fail with
            # "Account is not fully set up".
            docker exec "$CONTAINER" $KC update authentication/required-actions/VERIFY_PROFILE -r $REALM -s enabled=false 2>/dev/null \
              && echo "  Verify Profile disabled" || echo "  Verify Profile not registered (nothing to disable)"

            echo ""
            echo "=== Ensure web app clients exist with production URIs ==="
            # Realm import only runs on a fresh volume, so clients added to
            # chillax-realm.json after the first deploy must be upserted here.
            ensure_web_client() {
              NAME="$1"; ORIGIN="$2"
              CID=$(docker exec "$CONTAINER" $KC get clients -r $REALM -q clientId="$NAME" --fields id | \
                python3 -c "import sys,json;c=json.load(sys.stdin);print(c[0]['id'] if c else '')")
              if [ -z "$CID" ]; then
                echo "  Creating $NAME..."
                docker exec "$CONTAINER" $KC create clients -r $REALM \
                  -s clientId="$NAME" -s enabled=true -s publicClient=true \
                  -s standardFlowEnabled=true -s directAccessGrantsEnabled=false \
                  -s protocol=openid-connect \
                  -s "redirectUris=[\"$ORIGIN/*\"]" \
                  -s "webOrigins=[\"$ORIGIN\",\"+\"]" \
                  -s 'attributes={"pkce.code.challenge.method":"S256"}' \
                  -s 'defaultClientScopes=["openid","profile","email","roles","orders","catalog","rooms","spaces"]' && \
                  echo "  Created $NAME" || echo "  WARNING: failed to create $NAME"
              else
                echo "  Updating $NAME URIs..."
                docker exec "$CONTAINER" $KC update "clients/$CID" -r $REALM \
                  -s "redirectUris=[\"$ORIGIN/*\"]" \
                  -s "webOrigins=[\"$ORIGIN\",\"+\"]" && \
                  echo "  Updated $NAME" || echo "  WARNING: failed to update $NAME"
              fi
            }
            ensure_web_client admin-panel https://admin.chillax.site
            ensure_web_client client-web https://app.chillax.site
            ensure_web_client pos-web https://pos.chillax.site
            ensure_web_client kds-web https://kds.chillax.site

            # Native apps sign in with the password grant (no browser redirect),
            # so unlike the web clients they need direct access grants on and
            # an app-scheme redirect for the OIDC logout.
            ensure_native_client() {
              NAME="$1"; SCHEME="$2"
              CID=$(docker exec "$CONTAINER" $KC get clients -r $REALM -q clientId="$NAME" --fields id | \
                python3 -c "import sys,json;c=json.load(sys.stdin);print(c[0]['id'] if c else '')")
              if [ -z "$CID" ]; then
                echo "  Creating $NAME..."
                docker exec "$CONTAINER" $KC create clients -r $REALM \
                  -s clientId="$NAME" -s enabled=true -s publicClient=true \
                  -s standardFlowEnabled=true -s directAccessGrantsEnabled=true \
                  -s protocol=openid-connect \
                  -s "redirectUris=[\"$SCHEME://callback\",\"$SCHEME://*\"]" \
                  -s 'attributes={"pkce.code.challenge.method":"S256"}' \
                  -s 'defaultClientScopes=["openid","profile","email","roles","orders","catalog","rooms","spaces","branches"]' \
                  -s 'optionalClientScopes=["offline_access"]' && \
                  echo "  Created $NAME" || echo "  WARNING: failed to create $NAME"
                CID=$(docker exec "$CONTAINER" $KC get clients -r $REALM -q clientId="$NAME" --fields id | \
                  python3 -c "import sys,json;c=json.load(sys.stdin);print(c[0]['id'] if c else '')")
                [ -n "$CID" ] && docker exec "$CONTAINER" $KC create "clients/$CID/protocol-mappers/models" -r $REALM \
                  -s name=audience-mapper -s protocol=openid-connect -s protocolMapper=oidc-audience-mapper \
                  -s "config.\"included.client.audience\"=$NAME" -s 'config."id.token.claim"=false' \
                  -s 'config."access.token.claim"=true' >/dev/null 2>&1 || true
              else
                echo "  $NAME exists"
              fi
            }
            ensure_native_client pos-app com.chillax.pos
            ensure_native_client kds-app com.chillax.kds

            echo ""
            echo "=== Attach the 'branches' scope to the staff clients ==="
            # Customers never get it: mobile-app and client-web are not listed
            for NAME in admin-panel pos-web kds-web admin-app pos-app kds-app; do
              CID=$(docker exec "$CONTAINER" $KC get clients -r $REALM -q clientId="$NAME" --fields id | \
                python3 -c "import sys,json;c=json.load(sys.stdin);print(c[0]['id'] if c else '')")
              [ -z "$CID" ] && { echo "  $NAME: not found (skipped)"; continue; }
              docker exec "$CONTAINER" $KC update "clients/$CID/default-client-scopes/$SCOPE_ID" -r $REALM >/dev/null 2>&1 \
                && echo "  $NAME: attached" || echo "  $NAME: already attached"
            done

            echo ""
            echo "=== Reload the login theme if it changed ==="
            # Keycloak caches theme templates in memory and keeps a
            # pre-gzipped copy of every static file under data/tmp on its
            # volume; Caddy asks upstream for gzip, so a changed stylesheet
            # kept serving from that stale copy (2026-09-09). Clear the
            # cache and restart only when the theme files actually changed.
            THEME_SHA=$(find "$DEPLOY_DIR/keycloak-themes" -type f -exec sha256sum {} + | sort | sha256sum | cut -d' ' -f1)
            if [ "$(cat "$DEPLOY_DIR/.keycloak-theme.sha" 2>/dev/null)" != "$THEME_SHA" ]; then
              docker exec "$CONTAINER" sh -c 'rm -rf /opt/keycloak/data/tmp/kc-gzip-cache'
              docker restart "$CONTAINER" > /dev/null
              for i in $(seq 1 30); do
                docker logs --since 2m "$CONTAINER" 2>&1 | grep -q "started in" && break
                sleep 3
              done
              echo "$THEME_SHA" > "$DEPLOY_DIR/.keycloak-theme.sha"
              echo "  Theme changed: gzip cache cleared, Keycloak restarted"
            else
              echo "  Theme unchanged"
            fi

            echo ""
            echo "=== Keycloak token exchange setup complete ==="

  notify:
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Notify deployment status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "Deployment successful!"
          else
            echo "Deployment failed!"
            exit 1
          fi
