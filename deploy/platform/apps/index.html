<!doctype html>
<!--
  The native apps' download page: https://{platform domain}/apps

  One generic build of the till and the kitchen display serves every café;
  which café a tablet belongs to is set inside the app, from the QR code on
  the café's admin → Apps page. mobile-deploy.yml drops the APKs and their
  version notes (ninja-pos.apk + ninja-pos.json, ninja-kds.apk + ninja-kds.json)
  beside this file; a card whose note is missing says the app is not published
  yet. Caddy serves this folder as-is (deploy/platform/Caddyfile), so this is
  plain HTML: no build, no framework.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ninja · apps</title>
  <meta name="description" content="Download the ninja till and kitchen display for Android tablets.">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: #18181b; color: #fafafa;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif;
      display: flex; flex-direction: column; align-items: center; padding: 48px 16px 40px;
    }
    header { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
    header p { margin: 0; color: #a1a1aa; max-width: 34rem; line-height: 1.5; }
    .lang { position: absolute; top: 16px; inset-inline-end: 16px; }
    .lang button { background: none; border: 1px solid #3f3f46; color: #d4d4d8; border-radius: 999px; padding: 6px 14px; font: inherit; cursor: pointer; }
    .lang button:hover { border-color: #71717a; color: #fafafa; }
    main { width: 100%; max-width: 44rem; margin-top: 36px; display: grid; gap: 16px; }
    @media (min-width: 640px) { main { grid-template-columns: 1fr 1fr; } }
    .card { background: #27272a; border: 1px solid #3f3f46; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
    .card h2 { margin: 0; font-size: 1.125rem; }
    .card p { margin: 0; color: #a1a1aa; line-height: 1.5; font-size: .9375rem; }
    .meta { color: #71717a; font-size: .8125rem; margin-top: auto; padding-top: 8px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: #fafafa; color: #18181b; text-decoration: none; font-weight: 600; border-radius: 999px; padding: 10px 18px; margin-top: 6px; }
    .btn[aria-disabled="true"] { background: #3f3f46; color: #a1a1aa; pointer-events: none; }
    ol { width: 100%; max-width: 44rem; margin: 32px 0 0; padding-inline-start: 1.25rem; color: #d4d4d8; line-height: 1.6; }
    ol li + li { margin-top: 6px; }
    footer { margin-top: 40px; color: #71717a; font-size: .8125rem; }
    [dir="rtl"] ol { padding-inline-start: 1.25rem; }
  </style>
</head>

    <p data-t="intro"></p>
  </header>

  <main>
    <section class="card" data-app="pos">
      <h2 data-t="posTitle"></h2>
      <p data-t="posAbout"></p>
      <span class="meta" data-meta></span>
      <a class="btn" href="ninja-pos.apk" download data-download data-t="download"></a>
    </section>
    <section class="card" data-app="kds">
      <h2 data-t="kdsTitle"></h2>
      <p data-t="kdsAbout"></p>
      <span class="meta" data-meta></span>
      <a class="btn" href="ninja-kds.apk" download data-download data-t="download"></a>
    </section>
  </main>

  <ol>
    <li data-t="step1"></li>
    <li data-t="step2"></li>
    <li data-t="step3"></li>
  </ol>

  <footer data-t="footer"></footer>

  <script>
    const T = {
      en: {
        intro: 'The till and the kitchen display, for Android tablets. One app for every café: install it, then connect it to yours from inside.',
        posTitle: 'ninja POS', posAbout: 'The till: the floor, tickets, payments and shifts, on a landscape tablet by the counter.',
        kdsTitle: 'ninja KDS', kdsAbout: 'The kitchen display: every order as it comes in, bumped when it is done.',
        download: 'Download for Android', notYet: 'Not published yet', version: 'Version {v} · {d}',
        step1: 'Download the app on the tablet and open the file. Android asks once to allow installs from this source.',
        step2: 'Open the app. It asks which café it belongs to: scan the code on your admin app\'s Apps page, or type your café\'s address.',
        step3: 'Sign in with a staff account. To move the tablet to another café, sign out and change the café from Settings.',
        footer: 'iPhones and iPads run the web apps: pos.{café}.{domain} and kds.{café}.{domain}, added to the home screen.',
        toggle: 'العربية', dir: 'ltr', lang: 'en',
      },
      ar: {
        intro: 'الكاشير وشاشة المطبخ، لتابلت أندرويد. تطبيق واحد لكل الكافيهات: ثبّته، وبعدين وصّله بكافيهك من جواه.',
        posTitle: 'ninja POS', posAbout: 'الكاشير: الصالة، التذاكر، الدفع والشيفتات، على تابلت عرضي جنب الكاونتر.',
        kdsTitle: 'ninja KDS', kdsAbout: 'شاشة المطبخ: كل أوردر أول ما يوصل، ويتشال لما يخلص.',
        download: 'تحميل لأندرويد', notYet: 'لسه منزلش', version: 'إصدار {v} · {d}',
        step1: 'حمّل التطبيق على التابلت وافتح الملف. أندرويد هيسأل مرة واحدة تسمح بالتثبيت من المصدر ده.',
        step2: 'افتح التطبيق. هيسألك تابع أنهي كافيه: امسح الكود من صفحة التطبيقات في تطبيق الإدارة، أو اكتب عنوان كافيهك.',
        step3: 'سجّل دخول بحساب موظف. عشان تنقل التابلت لكافيه تاني، سجّل خروج وغيّر الكافيه من الإعدادات.',
        footer: 'الآيفون والآيباد بيشغّلوا نسخة الويب: pos.{café}.{domain} و kds.{café}.{domain}، مضافة للشاشة الرئيسية.',
        toggle: 'English', dir: 'rtl', lang: 'ar',
      },
    }
    const domain = location.hostname
    const asked = new URLSearchParams(location.search).get('lang')
    let lang = asked || ((navigator.language || '').startsWith('ar') ? 'ar' : 'en')
    if (!T[lang]) lang = 'en'
    const apply = () => {
      const t = T[lang]
      document.documentElement.lang = t.lang
      document.documentElement.dir = t.dir
      document.querySelectorAll('[data-t]').forEach((el) => {
        el.textContent = t[el.dataset.t].replace('{domain}', domain).replace('{domain}', domain)
      })
      document.getElementById('toggle').textContent = t.toggle
      document.querySelectorAll('[data-app]').forEach((card) => {
        const note = card._note
        const meta = card.querySelector('[data-meta]')
        const link = card.querySelector('[data-download]')
        if (note === undefined) return
        if (note) {
          meta.textContent = t.version.replace('{v}', note.version + ' (' + note.build + ')').replace('{d}', note.date)
          link.removeAttribute('aria-disabled')
        } else {
          meta.textContent = t.notYet
          link.setAttribute('aria-disabled', 'true')
        }
      })
    }
    document.getElementById('toggle').addEventListener('click', () => { lang = lang === 'ar' ? 'en' : 'ar'; apply() })
    apply()
    // Each card's version note, dropped by CI beside the APK; none means the app is not published yet
    document.querySelectorAll('[data-app]').forEach(async (card) => {
      try {
        const r = await fetch('ninja-' + card.dataset.app + '.json', { cache: 'no-store' })
        card._note = r.ok ? await r.json() : null
      } catch { card._note = null }
      apply()
    })
  </script>
</body>
</html>
