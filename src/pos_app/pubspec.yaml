name: pos_app
description: "ninja POS - the till, as an Android tablet app for every café on the platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  # ESC/POS printing, shared with the kitchen display
  ninja_printing:
    path: ../ninja_printing
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # UI Framework - shadcn-style components (same kit as admin_app / client_app)
  forui: ^0.19.0

  # State Management
  flutter_riverpod: ^3.1.0
  firebase_core: ^4.4.0
  firebase_crashlytics: ^5.0.7

  # Navigation
  go_router: ^17.0.1

  # HTTP Client
  dio: ^5.4.0

  # Authentication (token storage)
  flutter_secure_storage: ^10.0.0

  # UI Components
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Utils
  intl: any
  shared_preferences: ^2.2.2
  # The tenant's logo, kept on disk for printing
  path_provider: ^2.1.0
  equatable: ^2.0.5
  uuid: ^4.3.3
  collection: ^1.18.0

  # SignalR (realtime updates)
  signalr_netcore: ^1.3.7

  # A till screen stays on all day
  wakelock_plus: ^1.2.10

  # New-order chime (the same file the other apps ship)
  audioplayers: ^6.1.0

  # Native Splash
  flutter_native_splash: ^2.4.0
  url_launcher: ^6.3.2
  # The connect screen reads the QR code from the café's admin
  mobile_scanner: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/sounds/

  # Inter + Cairo, the pair pos_web loads from Google Fonts, bundled as
  # static instances (weights 400/500/600/700 cover shadcn's
  # font-normal/medium/semibold/bold).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
    # The platform's display face, for its wordmark on the loading screen only (OFL; licence beside it)
    - family: OriginalSurfer
      fonts:
        - asset: assets/fonts/OriginalSurfer-Regular.ttf

# The launcher icon is the platform's N mark on its dark tile, and the
# splash its wordmark on the same tile (both drawn from the bundled Original
# Surfer face): one build serves every café, and the café takes over inside
# once the tablet is connected to it. The icon files are drawn by
# src/scripts/generate-app-icons.mjs (which also draws the admin web's tile
# for this app). After that, regenerate with
#   dart run flutter_launcher_icons && dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/ninja_icon.png"
  adaptive_icon_background: "#18181B"
  adaptive_icon_foreground: "assets/images/ninja_foreground.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#18181B"
  image: assets/images/ninja_splash.png

  fullscreen: true

  android_12:
    color: "#18181B"
    image: assets/images/ninja_splash_android12.png
