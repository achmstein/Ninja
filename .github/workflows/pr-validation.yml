name: Ninja Pull Request Validation

# Every client and every service that has tests, on every pull request. The
# .NET job builds the solution filter and runs its unit and functional tests
# (the E2E suite boots Docker and stays out on purpose); the web job type-checks,
# lints and builds each SPA; the Flutter job analyzes and tests each app.

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v3
      - name: Build
        run: dotnet build Ninja.Web.slnf
      - name: Test
        run: dotnet test --solution Ninja.Web.slnf --no-build --no-progress --output detailed

  # The control plane's adapters against real Postgres, RabbitMQ and Keycloak
  # in containers (Testcontainers), as they run in production: the hand-over
  # SQL, rabbitmqctl, the admin API, pg_dump and pg_restore. Its own job so the
  # unit tests above stay fast; docker is on the runner already.
  control-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v3
      - name: Build
        run: dotnet build tests/Control.IntegrationTests/Control.IntegrationTests.csproj
      - name: Test
        run: dotnet test tests/Control.IntegrationTests/Control.IntegrationTests.csproj --no-build --no-progress --output detailed

  # The control plane through its front door: Control.API in-process on a dry-run
  # box over a real controldb in a Postgres container (Testcontainers), every
  # scenario a story from the audit trail. Docker for the container, so its
  # own job like the one above.
  control-functional:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v3
      - name: Build
        run: dotnet build tests/Control.FunctionalTests/Control.FunctionalTests.csproj
      - name: Test
        run: dotnet test tests/Control.FunctionalTests/Control.FunctionalTests.csproj --no-build --no-progress --output detailed

  # Each service through its own front door, on the shared Postgres and RabbitMQ
  # in containers (tests/Ninja.Testing). Docker, so its own job.
  service-functional:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: [Loyalty, Notification, Branch, Spaces]
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v3
      - name: Build
        run: dotnet build tests/${{ matrix.service }}.FunctionalTests/${{ matrix.service }}.FunctionalTests.csproj
      - name: Test
        run: dotnet test tests/${{ matrix.service }}.FunctionalTests/${{ matrix.service }}.FunctionalTests.csproj --no-build --no-progress --output detailed

  web:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin_web, pos_web, kds_web, client_web, control_web]
    defaults:
      run:
        working-directory: src/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/${{ matrix.app }}/package-lock.json
      - run: npm ci
      # tsc -b then vite build: a type error fails the PR
      - run: npm run build
      - name: Lint
        run: |
          if npm run | grep -q '^  lint$'; then npm run lint; else echo "no lint script"; fi
      - name: Unit tests
        run: |
          if npm run | grep -q '^  test$'; then npm test; else echo "no test script"; fi

  flutter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: client_app
            codegen: true
          - app: pos_app
            codegen: false
          - app: kds_app
            codegen: false
    defaults:
      run:
        working-directory: src/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - if: ${{ matrix.codegen }}
        run: flutter pub run build_runner build --delete-conflicting-outputs
      # Warnings fail, infos do not (flutter analyze's defaults)
      - run: flutter analyze
      - name: Tests
        run: |
          if [ -d test ] && ls test/*_test.dart test/**/*_test.dart >/dev/null 2>&1 && [ "${{ matrix.app }}" != "client_app" ]; then
            flutter test
          else
            echo "no test suite for ${{ matrix.app }}"
          fi
