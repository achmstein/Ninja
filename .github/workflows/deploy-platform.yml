name: Deploy Platform

# The shared box every tenant runs on: Postgres, RabbitMQ, Keycloak, Caddy,
# the control plane, and the five web builds served once for everyone.
# Tenant stacks are not touched here; the control plane stamps and upgrades
# those. Runs on its own server (PLATFORM_* secrets): the Chillax stack owns
# ports 80/443 on its box until it moves onto a stamp.
#
# Secrets: PLATFORM_SERVER_HOST, PLATFORM_SERVER_USER, PLATFORM_SERVER_SSH_KEY,
#   PLATFORM_POSTGRES_PASSWORD, PLATFORM_EVENTBUS_PASSWORD, PLATFORM_KEYCLOAK_PASSWORD,
#   PLATFORM_CONTROL_DB_PASSWORD (the control plane's own Postgres role),
#   PLATFORM_KEYCLOAK_CONTROL_PASSWORD (its own master-realm user),
#   PLATFORM_ENCRYPTION_KEY (openssl rand -base64 32: the tenants' secrets at rest),
#   PLATFORM_ADMIN_PASSWORD (first password of the `platform` user, temporary),
#   GEMINI_API_KEY (optional), FIREBASE_WEB_* (optional, web push), GHCR_TOKEN
#   (optional: the run's own GITHUB_TOKEN pulls this repo's images otherwise).
# Variables: PLATFORM_DOMAIN (e.g. ninja.app), PLATFORM_SLUG_LABEL (2 for a
#   two-label domain, 3 for co.uk-style), ACME_EMAIL, PLATFORM_ADMIN_ALLOW_CIDR
#   (where the Keycloak admin console may be opened from; nowhere until set).

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag for the control plane and for new tenants: a release (vYYYY.MM.DD)"
        required: true
        type: string
      allow_unreleased:
        description: "Deploy a tag that is not a release (a sha, latest); only for a staging box"
        default: false
        type: boolean
      environment:
        description: "The GitHub environment holding the box's secrets"
        default: platform
        type: choice
        options: [platform, platform-staging]
      web:
        description: "Rebuild and ship the five web apps"
        default: true
        type: boolean

env:
  DEPLOY_DIR: /opt/ninja/platform
  PLATFORM_DOMAIN: ${{ vars.PLATFORM_DOMAIN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Check the platform domain is set
        run: |
          if [ -z "$PLATFORM_DOMAIN" ]; then
            echo "::error::Set the PLATFORM_DOMAIN repository variable (e.g. ninja.app) first."
            exit 1
          fi
          echo "Platform domain: $PLATFORM_DOMAIN"

      # A release is what docker-build.yml stamps on all twelve services and the control image at once;
      # anything else is work in progress and has nothing to roll a fleet back to
      - name: Check the image tag is a release
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          ALLOW_UNRELEASED: ${{ inputs.allow_unreleased }}
        run: |
          if [[ "$IMAGE_TAG" =~ ^v[0-9] ]]; then echo "Release $IMAGE_TAG"; exit 0; fi
          if [ "$ALLOW_UNRELEASED" = "true" ]; then echo "::warning::$IMAGE_TAG is not a release; deploying it because allow_unreleased is set"; exit 0; fi
          echo "::error::$IMAGE_TAG is not a release tag (vYYYY.MM.DD). Push a tag, or set allow_unreleased for a staging box."
          exit 1

      - name: Setup Node
        if: ${{ inputs.web }}
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Every tenant is served the same build; the realm and colours come from
      # /api/tenant at runtime. Only Keycloak's host is baked in.
      - name: Build web apps
        if: ${{ inputs.web }}
        env:
          VITE_KEYCLOAK_URL: https://auth.${{ vars.PLATFORM_DOMAIN }}
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_WEB_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_WEB_PROJECT_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_WEB_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.FIREBASE_WEB_VAPID_KEY }}
        run: |
          set -e
          mkdir -p web-artifacts
          for app in admin_web client_web pos_web kds_web control_web; do
            name="${app%_web}-web"
            echo "::group::$name"
            (cd "src/$app" && npm ci && npm run build)
            cp -r "src/$app/dist" "web-artifacts/$name"
            echo "::endgroup::"
          done

      - name: Prepare platform artifacts
        env:
          POSTGRES_PASSWORD: ${{ secrets.PLATFORM_POSTGRES_PASSWORD }}
          EVENTBUS_PASSWORD: ${{ secrets.PLATFORM_EVENTBUS_PASSWORD }}
          KEYCLOAK_PASSWORD: ${{ secrets.PLATFORM_KEYCLOAK_PASSWORD }}
          CONTROL_DB_PASSWORD: ${{ secrets.PLATFORM_CONTROL_DB_PASSWORD }}
          KEYCLOAK_CONTROL_PASSWORD: ${{ secrets.PLATFORM_KEYCLOAK_CONTROL_PASSWORD }}
          PLATFORM_ENCRYPTION_KEY: ${{ secrets.PLATFORM_ENCRYPTION_KEY }}
          ADMIN_ALLOW_CIDR: ${{ vars.PLATFORM_ADMIN_ALLOW_CIDR }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional: a copy of every backup off the box (any S3-compatible bucket) and the weekly restore drill
          OFFSITE_ENDPOINT: ${{ secrets.PLATFORM_OFFSITE_ENDPOINT }}
          OFFSITE_BUCKET: ${{ secrets.PLATFORM_OFFSITE_BUCKET }}
          OFFSITE_ACCESS_KEY: ${{ secrets.PLATFORM_OFFSITE_ACCESS_KEY }}
          OFFSITE_SECRET_KEY: ${{ secrets.PLATFORM_OFFSITE_SECRET_KEY }}
          OFFSITE_REGION: ${{ vars.PLATFORM_OFFSITE_REGION }}
          RESTORE_DRILL_ENABLED: ${{ vars.PLATFORM_RESTORE_DRILL_ENABLED }}
          # Optional: how the platform sends mail (any SMTP); the realms get the same settings for password resets
          MAIL_HOST: ${{ secrets.PLATFORM_MAIL_HOST }}
          MAIL_PORT: ${{ secrets.PLATFORM_MAIL_PORT }}
          MAIL_USER: ${{ secrets.PLATFORM_MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.PLATFORM_MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.PLATFORM_MAIL_FROM }}
          MAIL_OPS_TO: ${{ secrets.PLATFORM_MAIL_OPS_TO }}
          SOCIAL_GOOGLE_CLIENT_ID: ${{ secrets.PLATFORM_SOCIAL_GOOGLE_CLIENT_ID }}
          SOCIAL_GOOGLE_CLIENT_SECRET: ${{ secrets.PLATFORM_SOCIAL_GOOGLE_CLIENT_SECRET }}
          SOCIAL_APPLE_CLIENT_ID: ${{ secrets.PLATFORM_SOCIAL_APPLE_CLIENT_ID }}
          SOCIAL_APPLE_CLIENT_SECRET: ${{ secrets.PLATFORM_SOCIAL_APPLE_CLIENT_SECRET }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          PLATFORM_SLUG_LABEL: ${{ vars.PLATFORM_SLUG_LABEL }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -e
          for v in POSTGRES_PASSWORD EVENTBUS_PASSWORD KEYCLOAK_PASSWORD CONTROL_DB_PASSWORD KEYCLOAK_CONTROL_PASSWORD PLATFORM_ENCRYPTION_KEY PLATFORM_ADMIN_PASSWORD ACME_EMAIL; do
            if [ -z "${!v}" ]; then echo "::error::$v is empty"; exit 1; fi
          done
          if [ "$(echo -n "$PLATFORM_ENCRYPTION_KEY" | base64 -d 2>/dev/null | wc -c)" != "32" ]; then
            echo "::error::PLATFORM_ENCRYPTION_KEY must be the base64 of 32 bytes (openssl rand -base64 32)"; exit 1
          fi

          mkdir -p platform-artifacts/realms platform-artifacts/themes platform-artifacts/apps
          cp deploy/platform/docker-compose.yml platform-artifacts/
          cp deploy/platform/Caddyfile platform-artifacts/
          cp deploy/platform/init-multiple-databases.sh platform-artifacts/
          cp deploy/platform/control-role.sh platform-artifacts/
          cp deploy/platform/README.md platform-artifacts/
          # The control plane rewrites this file; only seed it when the server has none
          cp deploy/platform/custom-domains.caddy platform-artifacts/custom-domains.caddy.seed
          # The login theme every realm uses, from where the AppHost mounts it
          cp -r src/Ninja.AppHost/KeycloakConfiguration/themes/ninja platform-artifacts/themes/ninja
          # The native apps' download page; the APKs land beside it from mobile-deploy.yml
          cp deploy/platform/apps/index.html platform-artifacts/apps/

          cat > platform-artifacts/.env <<EOF
          PLATFORM_DOMAIN=$PLATFORM_DOMAIN
          PLATFORM_SLUG_LABEL=${PLATFORM_SLUG_LABEL:-2}
          ACME_EMAIL=$ACME_EMAIL
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          EVENTBUS_PASSWORD=$EVENTBUS_PASSWORD
          KEYCLOAK_PASSWORD=$KEYCLOAK_PASSWORD
          CONTROL_DB_PASSWORD=$CONTROL_DB_PASSWORD
          KEYCLOAK_CONTROL_USER=platform-control
          KEYCLOAK_CONTROL_PASSWORD=$KEYCLOAK_CONTROL_PASSWORD
          PLATFORM_ENCRYPTION_KEY=$PLATFORM_ENCRYPTION_KEY
          ADMIN_ALLOW_CIDR=${ADMIN_ALLOW_CIDR:-127.0.0.1/32}
          GEMINI_API_KEY=$GEMINI_API_KEY
          OFFSITE_ENDPOINT=$OFFSITE_ENDPOINT
          OFFSITE_BUCKET=$OFFSITE_BUCKET
          OFFSITE_ACCESS_KEY=$OFFSITE_ACCESS_KEY
          OFFSITE_SECRET_KEY=$OFFSITE_SECRET_KEY
          OFFSITE_REGION=${OFFSITE_REGION:-auto}
          RESTORE_DRILL_ENABLED=${RESTORE_DRILL_ENABLED:-false}
          MAIL_HOST=$MAIL_HOST
          MAIL_PORT=${MAIL_PORT:-587}
          MAIL_USER=$MAIL_USER
          MAIL_PASSWORD=$MAIL_PASSWORD
          MAIL_FROM=$MAIL_FROM
          MAIL_OPS_TO=$MAIL_OPS_TO
          SOCIAL_GOOGLE_CLIENT_ID=$SOCIAL_GOOGLE_CLIENT_ID
          SOCIAL_GOOGLE_CLIENT_SECRET=$SOCIAL_GOOGLE_CLIENT_SECRET
          SOCIAL_APPLE_CLIENT_ID=$SOCIAL_APPLE_CLIENT_ID
          SOCIAL_APPLE_CLIENT_SECRET=$SOCIAL_APPLE_CLIENT_SECRET
          IMAGE_REGISTRY=ghcr.io/${{ github.repository_owner }}/ninja
          IMAGE_TAG=${IMAGE_TAG:-latest}
          EOF

          # The platform realm, imported by Keycloak on its first boot
          python3 - <<'PY'
          import json, os
          t = open('src/Control.API/Templates/platform-realm.json', encoding='utf-8').read()
          t = t.replace('{{controlUrl}}', f"https://control.{os.environ['PLATFORM_DOMAIN']}")
          t = t.replace('{{platformDomain}}', os.environ['PLATFORM_DOMAIN'])
          t = t.replace('{{sslRequired}}', 'external')
          t = t.replace('{{platformPassword}}', json.dumps(os.environ['PLATFORM_ADMIN_PASSWORD'])[1:-1])
          # The realm's own SMTP (password resets), the same settings the control plane mails with; {} while mail is off
          smtp = {}
          if os.environ.get('MAIL_HOST'):
              smtp = {'host': os.environ['MAIL_HOST'], 'port': os.environ.get('MAIL_PORT') or '587', 'from': os.environ.get('MAIL_FROM') or f"no-reply@{os.environ['PLATFORM_DOMAIN']}",
                      'fromDisplayName': 'Ninja', 'auth': 'true' if os.environ.get('MAIL_USER') else 'false', 'starttls': 'true', 'ssl': 'false'}
              if os.environ.get('MAIL_USER'):
                  smtp.update(user=os.environ['MAIL_USER'], password=os.environ.get('MAIL_PASSWORD', ''))
          t = t.replace('{{smtpServer}}', json.dumps(smtp))
          json.loads(t)
          open('platform-artifacts/realms/ninja-realm.json', 'w', encoding='utf-8').write(t)
          PY

          if [ -d web-artifacts ]; then
            mkdir -p platform-artifacts/web-incoming
            cp -r web-artifacts/. platform-artifacts/web-incoming/
          fi
          find platform-artifacts -maxdepth 2 -not -path '*/web-incoming/*' | sort

      - name: Copy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PLATFORM_SERVER_HOST }}
          username: ${{ secrets.PLATFORM_SERVER_USER }}
          key: ${{ secrets.PLATFORM_SERVER_SSH_KEY }}
          source: "platform-artifacts/*,platform-artifacts/.env"
          target: ${{ env.DEPLOY_DIR }}
          strip_components: 1

      - name: Bring the platform up
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          SHIP_WEB: ${{ inputs.web }}
        with:
          host: ${{ secrets.PLATFORM_SERVER_HOST }}
          username: ${{ secrets.PLATFORM_SERVER_USER }}
          key: ${{ secrets.PLATFORM_SERVER_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,DEPLOY_DIR,SHIP_WEB
          script: |
            set -e

            # First time on a box: docker, the folders, the firewall
            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com | sh
              sudo usermod -aG docker "$USER"
              sudo systemctl enable --now docker
            fi
            sudo mkdir -p /opt/ninja/tenants "$DEPLOY_DIR/web"
            sudo chown -R "$USER:$USER" /opt/ninja
            # 80, 443 and 443/udp (Caddy serves HTTP/3) on whichever firewall is
            # really in force. Asking only "is ufw installed?" is not enough: Oracle
            # Cloud's Ubuntu images ship ufw inactive and do the blocking with
            # pre-loaded iptables rules that drop everything but 22, so `ufw allow`
            # there succeeds and changes nothing, and the edge stays unreachable.
            if command -v firewall-cmd >/dev/null 2>&1 && sudo firewall-cmd --state >/dev/null 2>&1; then
              sudo firewall-cmd --permanent --add-service=http >/dev/null
              sudo firewall-cmd --permanent --add-service=https >/dev/null
              sudo firewall-cmd --permanent --add-port=443/udp >/dev/null
              sudo firewall-cmd --reload >/dev/null
              echo "firewall: firewalld"
            elif command -v ufw >/dev/null 2>&1 && sudo ufw status 2>/dev/null | grep -qi '^Status: active'; then
              sudo ufw allow 22/tcp >/dev/null; sudo ufw allow 80/tcp >/dev/null; sudo ufw allow 443/tcp >/dev/null; sudo ufw allow 443/udp >/dev/null
              echo "firewall: ufw"
            elif command -v iptables >/dev/null 2>&1; then
              # -C first so a redeploy does not stack duplicates; -I 1 to land above the drop
              for spec in "tcp 80" "tcp 443" "udp 443"; do
                proto=${spec% *}; port=${spec#* }
                sudo iptables -C INPUT -p "$proto" --dport "$port" -j ACCEPT 2>/dev/null \
                  || sudo iptables -I INPUT 1 -p "$proto" --dport "$port" -j ACCEPT
              done
              if command -v netfilter-persistent >/dev/null 2>&1; then
                sudo netfilter-persistent save >/dev/null
              elif [ -d /etc/iptables ]; then
                sudo sh -c 'iptables-save > /etc/iptables/rules.v4'
              else
                echo "::warning::iptables rules opened but not persisted; they will be lost on reboot"
              fi
              echo "firewall: iptables"
            else
              echo "::warning::no firewall tool found; make sure 80/tcp, 443/tcp and 443/udp are open"
            fi

            cd "$DEPLOY_DIR"
            chmod 600 .env
            [ -f custom-domains.caddy ] || cp custom-domains.caddy.seed custom-domains.caddy

            # The web builds are bind-mounted into Caddy: sync INTO the folders,
            # never replace them, or Caddy keeps serving the detached inode
            if [ "$SHIP_WEB" = "true" ] && [ -d web-incoming ]; then
              for name in admin-web client-web pos-web kds-web control-web; do
                [ -d "web-incoming/$name" ] || continue
                mkdir -p "web/$name"
                find "web/$name" -mindepth 1 -delete
                cp -a "web-incoming/$name/." "web/$name/"
                echo "Deployed $name"
              done
              rm -rf web-incoming
            fi
            for name in admin-web client-web pos-web kds-web control-web; do mkdir -p "web/$name"; done

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            docker compose pull

            # Before anything changes: the platform's own databases, dumped on the box, so a migration that goes wrong has
            # something to go back to (the control plane's nightly one may be a day old). Kept beside the nightly ones.
            if docker compose ps --status running postgres 2>/dev/null | grep -q postgres; then
              PG_PASSWORD=$(grep -oP '^POSTGRES_PASSWORD=\K.*' .env)
              stamp=$(date -u +%Y%m%d-%H%M%S)
              mkdir -p /opt/ninja/tenants/_platform/pre-deploy
              for db in controldb keycloak; do
                docker compose exec -T -e PGPASSWORD="$PG_PASSWORD" postgres pg_dump -U postgres -Fc "$db" > "/opt/ninja/tenants/_platform/pre-deploy/$stamp-$db.dump"
                [ -s "/opt/ninja/tenants/_platform/pre-deploy/$stamp-$db.dump" ] || { echo "::error::the pre-deploy dump of $db is empty"; exit 1; }
              done
              ls -t /opt/ninja/tenants/_platform/pre-deploy/*.dump | tail -n +11 | xargs -r rm --
              echo "Pre-deploy dumps: $stamp"
            fi

            # The shared services first: the control role must exist before the control plane connects as it
            docker compose up -d postgres
            for i in $(seq 1 30); do
              if docker compose exec -T postgres pg_isready -U postgres >/dev/null 2>&1; then break; fi
              if [ "$i" -eq 30 ]; then echo "::error::Postgres never answered"; exit 1; fi
              sleep 2
            done
            # Idempotent: the role, controldb handed to it, the password kept in step with .env (a fresh box did this on init)
            CONTROL_DB_PASSWORD=$(grep -oP '^CONTROL_DB_PASSWORD=\K.*' .env)
            docker compose exec -T -e CONTROL_DB_PASSWORD="$CONTROL_DB_PASSWORD" postgres bash /docker-entrypoint-initdb.d/zz-control-role.sh
            docker compose up -d --remove-orphans
            # The Caddyfile is a single-file bind mount; scp replaced the inode
            docker compose up -d --force-recreate caddy

            docker image prune -f >/dev/null
            docker compose ps

            # The realm import only runs on first boot, so the platform realm's
            # login theme is enforced on every deploy (idempotent), the way
            # deploy.yml does for Chillax. Tenant realms get theirs when stamped.
            KC=/opt/keycloak/bin/kcadm.sh
            KC_PASSWORD=$(grep -oP '^KEYCLOAK_PASSWORD=\K.*' .env)
            for i in $(seq 1 30); do
              if docker compose exec -T keycloak $KC config credentials --server http://localhost:8080 --realm master --user admin --password "$KC_PASSWORD" >/dev/null 2>&1; then break; fi
              if [ "$i" -eq 30 ]; then echo "::error::Keycloak never answered; realm settings not applied"; exit 1; fi
              sleep 5
            done
            docker compose exec -T keycloak $KC update realms/ninja -s loginTheme=ninja
            # Short sessions for the console that can destroy tenants, and a second factor for everyone in it:
            # the OTP form is REQUIRED in the browser flow, so a user without one is asked to set it up at sign-in
            docker compose exec -T keycloak $KC update realms/ninja -s accessTokenLifespan=900 -s ssoSessionIdleTimeout=28800 -s ssoSessionMaxLifespan=86400 -s otpPolicyType=totp
            docker compose exec -T keycloak $KC update authentication/required-actions/CONFIGURE_TOTP -r ninja -s enabled=true -s defaultAction=true
            OTP_EXEC=$(docker compose exec -T keycloak $KC get authentication/flows/browser/executions -r ninja | python3 -c 'import json,sys; print(next(e["id"] for e in json.load(sys.stdin) if e.get("providerId") == "auth-otp-form"))')
            docker compose exec -T keycloak $KC update authentication/flows/browser/executions -r ninja -b "{\"id\":\"$OTP_EXEC\",\"requirement\":\"REQUIRED\"}"
            echo "Platform realm: login theme, sessions and OTP applied"

            # The control plane's own master-realm user, so the bootstrap admin is only for people and can be rotated alone
            KC_CONTROL_USER=$(grep -oP '^KEYCLOAK_CONTROL_USER=\K.*' .env)
            KC_CONTROL_PASSWORD=$(grep -oP '^KEYCLOAK_CONTROL_PASSWORD=\K.*' .env)
            if ! docker compose exec -T keycloak $KC get users -r master -q username="$KC_CONTROL_USER" -q exact=true | grep -q '"id"'; then
              docker compose exec -T keycloak $KC create users -r master -s username="$KC_CONTROL_USER" -s enabled=true -s emailVerified=true
              docker compose exec -T keycloak $KC add-roles -r master --uusername "$KC_CONTROL_USER" --rolename admin
              echo "Keycloak: $KC_CONTROL_USER created with the admin role"
            fi
            docker compose exec -T keycloak $KC set-password -r master --username "$KC_CONTROL_USER" --new-password "$KC_CONTROL_PASSWORD"
            docker compose up -d control-api

      # Through the edge, so DNS, certificates, Caddy, Keycloak and the control
      # plane are all on the path
      - name: Smoke test
        run: |
          set -e
          check() {
            local url="$1" tries="${2:-24}"
            for i in $(seq 1 "$tries"); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$url" || true)
              if [ "$code" = "200" ]; then echo "OK   $url"; return 0; fi
              echo "wait $url ($code)"; sleep 10
            done
            echo "::error::$url never answered 200"; return 1
          }
          check "https://auth.$PLATFORM_DOMAIN/realms/ninja"
          check "https://control.$PLATFORM_DOMAIN/"
          # Anonymous, and proves the control plane is up behind Caddy
          check "https://control.$PLATFORM_DOMAIN/api/control/tls/ask?domain=auth.$PLATFORM_DOMAIN"
