# Chillax login theme: the forms are Keycloak's base templates (plain markup,
# no PatternFly); the page frame is ours (template.ftl) and every component
# class below maps to the shadcn-style rules in css/chillax.css.
parent=base
import=common/keycloak

styles=css/chillax.css
# Bump whenever css/chillax.css changes: it is the cache-buster on the link
themeVersion=2
locales=en,ar

kcHtmlClass=chx
kcBodyClass=chx-body

# Form structure
kcFormClass=chx-form
kcFormGroupClass=chx-field
kcLabelWrapperClass=chx-label-row
kcLabelClass=chx-label
kcInputWrapperClass=chx-control
kcContentWrapperClass=chx-content
kcFormSettingClass=chx-form-setting
kcFormOptionsClass=chx-form-options
kcFormOptionsWrapperClass=chx-form-options-wrapper
kcFormButtonsClass=chx-form-buttons
kcMarginTopClass=chx-mt

# Inputs
kcInputClass=chx-input
kcInputGroup=chx-input-group
kcInputGroupItemClass=chx-input-group-item
kcFill=chx-fill
kcFormReadOnlyClass=chx-input-readonly
kcFormPasswordVisibilityButtonClass=chx-toggle
kcFormPasswordVisibilityIconShow=chx-icon chx-eye
kcFormPasswordVisibilityIconHide=chx-icon chx-eye-off
kcInputErrorMessageClass=chx-error
kcInputHelperTextBeforeClass=chx-help
kcInputHelperTextAfterClass=chx-help
kcInputHelperTextItemTextClass=chx-note
kcInputRequiredClass=chx-required

# Checkboxes and radios (register form options, terms)
kcCheckboxClass=chx-checkbox
kcCheckboxInputClass=chx-checkbox-input
kcCheckboxLabelClass=chx-checkbox-label
kcInputClassCheckbox=chx-checkbox
kcInputClassCheckboxInput=chx-checkbox-input
kcInputClassCheckboxLabel=chx-checkbox-label
kcInputClassRadio=chx-checkbox
kcInputClassRadioInput=chx-checkbox-input
kcInputClassRadioLabel=chx-checkbox-label

# Buttons
kcButtonClass=chx-button
kcButtonPrimaryClass=chx-button-primary
kcButtonDefaultClass=chx-button-outline
kcButtonSecondaryClass=chx-button-outline
kcButtonLinkClass=chx-button-link
kcButtonBlockClass=chx-button-block
kcButtonLargeClass=

# Alerts (the frame adds chx-alert-<type>)
kcAlertClass=chx-alert
kcAlertIconClass=chx-alert-icon
kcAlertTitleClass=chx-alert-title
kcFeedbackErrorIcon=
kcFeedbackWarningIcon=
kcFeedbackSuccessIcon=
kcFeedbackInfoIcon=

# Social sign-in (Google, Apple)
kcFormSocialAccountSectionClass=chx-social
kcFormSocialAccountListClass=chx-social-list
kcFormSocialAccountListGridClass=
kcFormSocialAccountGridItem=
kcFormSocialAccountListButtonClass=chx-button chx-button-outline chx-button-block chx-social-button
kcFormSocialAccountListButtonDisabledClass=chx-disabled
kcFormSocialAccountNameClass=chx-social-name
kcCommonLogoIdP=chx-idp-icon
