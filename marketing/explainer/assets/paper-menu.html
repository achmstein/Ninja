<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lora:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#8a6f55;display:grid;place-items:center;height:100vh}
.paper{width:760px;padding:70px 80px;background:#fbf7ee;color:#2b2118;font-family:Lora,serif;transform:rotate(-2deg);box-shadow:0 30px 60px rgba(0,0,0,.35)}

.sub{text-align:center;letter-spacing:.3em;font-size:14px;margin-bottom:40px}
h2{font-family:'Playfair Display',serif;font-size:28px;margin:30px 0 12px;border-bottom:1px solid #cdbfa8;padding-bottom:6px}
.r{display:flex;font-size:22px;margin:10px 0}.r span:nth-child(2){flex:1;border-bottom:2px dotted #b9a88c;margin:0 10px 7px}
.d{font-size:15px;color:#6b5b48;margin:-6px 0 8px}
</style></head><body><div class="paper">

<div class="r"><span>Flat White</span><span></span><span>65</span></div>
<div class="r"><span>Pistachio Latte</span><span></span><span>85</span></div>
<h2>Sweets</h2>
<div class="r"><span>San Sebastian Cheesecake</span><span></span><span>95</span></div>
<div class="r"><span>Molten Chocolate Cake</span><span></span><span>90</span></div>
<div class="r"><span>Kunafa Cup</span><span></span><span>75</span></div>
</div></body></html>
