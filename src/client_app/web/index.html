  <meta charset="UTF-8">

  <meta name="apple-mobile-web-app-title" content="Ninja">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Ninja</title>
  <link rel="manifest" href="manifest.json">
  
  
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  <!-- The splash while the app loads: a light page with the business's wordmark from the brand the app
       kept on this device last time (flutter.ninja-brand), in the language chosen there; on a first visit,
       the plain page, as the web app shows. Written by hand: pubspec's flutter_native_splash has web: false -->
  <style id="splash-screen-style">
    html { height: 100% }
    body { margin: 0; min-height: 100%; background-color: #FFFFFF; }
    #splash { position: fixed; inset: 0; display: grid; place-items: center; }
    #splash img { max-width: 60vw; max-height: 96px; object-fit: contain; }
  </style>
  <script id="splash-screen-script">
    // Called by FlutterNativeSplash.remove() once the first frame is up
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>
<body>
  <div id="splash" aria-hidden="true"></div>
  <script>
    (function () {
      try {
        // shared_preferences keeps each value JSON-encoded under "flutter."
        const read = (key) => { const raw = localStorage.getItem("flutter." + key); return raw == null ? null : JSON.parse(raw); };
        const brandJson = read("ninja-brand");
        if (!brandJson) return;
        const brand = JSON.parse(brandJson);
        const arabic = (read("app_locale") || navigator.language || "").toLowerCase().startsWith("ar");
        const marks = brand.wordmarks || {};
        const mark = (arabic ? (marks.ar || marks.en) : marks.en) || null;
        const url = (mark && mark.url) || brand.logoUrl;
        if (!url) return;
        const img = document.createElement("img");
        img.src = url;
        img.alt = "";
        document.getElementById("splash").appendChild(img);
      } catch (_) {
        // Nothing kept, or kept in another shape: the plain page
      }
    })();
  </script>
