name: Deploy Web Apps

# Fast path for SPA-only changes: builds admin_web / client_web and syncs the
# bundles into the directories Caddy serves. No backend images, no Aspire
# publish, no container restarts (Caddy file_server reads from disk).
#
# For backend changes use docker-build.yml + deploy.yml (which also ships the
# web bundles as part of a full deploy).

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app to deploy'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - admin
          - client
          - pos
          - kds

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build admin_web
        if: ${{ github.event.inputs.app == 'both' || github.event.inputs.app == 'admin' }}
        env:
          # Keycloak's dedicated production host, same as deploy.yml bakes in.
          # api.chillax.site/auth is a compatibility path for installed mobile
          # apps, not where a freshly built SPA should be sent.
          VITE_KEYCLOAK_URL: https://auth.chillax.site
          VITE_KEYCLOAK_REALM: chillax
          # Here the customer app is app.chillax.site, not admin.chillax.site
          # minus its label as on the platform, so the brand page is told.
          VITE_CUSTOMER_URL: https://app.chillax.site
          # Firebase web push for admin_web (the owner's digest) and client_web
          # (notify-me). Empty secrets leave push off; nothing else changes.
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_WEB_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_WEB_PROJECT_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_WEB_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.FIREBASE_WEB_VAPID_KEY }}
        run: |
          cd src/admin_web
          npm ci
          npm run build
          mkdir -p ../../web-artifacts
          cp -r dist ../../web-artifacts/admin-web

      - name: Build client_web
        if: ${{ github.event.inputs.app == 'both' || github.event.inputs.app == 'client' }}
        env:
          VITE_KEYCLOAK_URL: https://auth.chillax.site
          VITE_KEYCLOAK_REALM: chillax
          # Firebase web push for admin_web (the owner's digest) and client_web
          # (notify-me). Empty secrets leave push off; nothing else changes.
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_WEB_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_WEB_PROJECT_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_WEB_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.FIREBASE_WEB_VAPID_KEY }}
        run: |
          cd src/client_web
          npm ci
          npm run build
          mkdir -p ../../web-artifacts
          cp -r dist ../../web-artifacts/client-web

      - name: Build pos_web
        if: ${{ github.event.inputs.app == 'both' || github.event.inputs.app == 'pos' }}
        env:
          VITE_KEYCLOAK_URL: https://auth.chillax.site
          VITE_KEYCLOAK_REALM: chillax
        run: |
          cd src/pos_web
          npm ci
          npm run build
          mkdir -p ../../web-artifacts
          cp -r dist ../../web-artifacts/pos-web

      - name: Build kds_web
        if: ${{ github.event.inputs.app == 'both' || github.event.inputs.app == 'kds' }}
        env:
          VITE_KEYCLOAK_URL: https://auth.chillax.site
          VITE_KEYCLOAK_REALM: chillax
        run: |
          cd src/kds_web
          npm ci
          npm run build
          mkdir -p ../../web-artifacts
          cp -r dist ../../web-artifacts/kds-web

      - name: Copy bundles to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "web-artifacts/*"
          target: ${{ secrets.DEPLOY_PATH }}/web-incoming
          strip_components: 1

      - name: Swap bundles into place
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            # admin-web/ and client-web/ are bind-mounted into the Caddy
            # container, so sync INTO them — replacing the directory itself
            # would detach the mount and Caddy would keep serving old files.
            swap() {
              [ -d "web-incoming/$1" ] || return 0
              mkdir -p "$1"
              find "$1" -mindepth 1 -delete
              cp -a "web-incoming/$1/." "$1/"
              echo "Deployed $1"
            }
            swap admin-web
            swap client-web
            swap pos-web
            swap kds-web
            rm -rf web-incoming
