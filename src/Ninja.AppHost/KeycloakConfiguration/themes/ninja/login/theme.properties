# Ninja login theme, shared by every realm: the forms are Keycloak's base
# templates (plain markup, no PatternFly); the page frame is ours
# (template.ftl) and every component class below maps to the shadcn-style
# rules in css/ninja.css.
parent=base
import=common/keycloak

styles=css/ninja.css
# Bump whenever css/ninja.css changes: it is the cache-buster on the link
themeVersion=4
locales=en,ar

kcHtmlClass=nj
kcBodyClass=nj-body

# Form structure
kcFormClass=nj-form
kcFormGroupClass=nj-field
kcLabelWrapperClass=nj-label-row
kcLabelClass=nj-label
kcInputWrapperClass=nj-control
kcContentWrapperClass=nj-content
kcFormSettingClass=nj-form-setting
kcFormOptionsClass=nj-form-options
kcFormOptionsWrapperClass=nj-form-options-wrapper
kcFormButtonsClass=nj-form-buttons
kcMarginTopClass=nj-mt

# Inputs
kcInputClass=nj-input
kcInputGroup=nj-input-group
kcInputGroupItemClass=nj-input-group-item
kcFill=nj-fill
kcFormReadOnlyClass=nj-input-readonly
kcFormPasswordVisibilityButtonClass=nj-toggle
kcFormPasswordVisibilityIconShow=nj-icon nj-eye
kcFormPasswordVisibilityIconHide=nj-icon nj-eye-off
kcInputErrorMessageClass=nj-error
kcInputHelperTextBeforeClass=nj-help
kcInputHelperTextAfterClass=nj-help
kcInputHelperTextItemTextClass=nj-note
kcInputRequiredClass=nj-required

# Checkboxes and radios (register form options, terms)
kcCheckboxClass=nj-checkbox
kcCheckboxInputClass=nj-checkbox-input
kcCheckboxLabelClass=nj-checkbox-label
kcInputClassCheckbox=nj-checkbox
kcInputClassCheckboxInput=nj-checkbox-input
kcInputClassCheckboxLabel=nj-checkbox-label
kcInputClassRadio=nj-checkbox
kcInputClassRadioInput=nj-checkbox-input
kcInputClassRadioLabel=nj-checkbox-label

# Buttons
kcButtonClass=nj-button
kcButtonPrimaryClass=nj-button-primary
kcButtonDefaultClass=nj-button-outline
kcButtonSecondaryClass=nj-button-outline
kcButtonLinkClass=nj-button-link
kcButtonBlockClass=nj-button-block
kcButtonLargeClass=

# Alerts (the frame adds nj-alert-<type>)
kcAlertClass=nj-alert
kcAlertIconClass=nj-alert-icon
kcAlertTitleClass=nj-alert-title
kcFeedbackErrorIcon=
kcFeedbackWarningIcon=
kcFeedbackSuccessIcon=
kcFeedbackInfoIcon=

# Social sign-in (Google, Apple)
kcFormSocialAccountSectionClass=nj-social
kcFormSocialAccountListClass=nj-social-list
kcFormSocialAccountListGridClass=
kcFormSocialAccountGridItem=
kcFormSocialAccountListButtonClass=nj-button nj-button-outline nj-button-block nj-social-button
kcFormSocialAccountListButtonDisabledClass=nj-disabled
kcFormSocialAccountNameClass=nj-social-name
kcCommonLogoIdP=nj-idp-icon
