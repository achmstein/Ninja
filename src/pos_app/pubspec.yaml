name: pos_app
description: "Chillax POS - the till, as an Android tablet app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # UI Framework - shadcn-style components (same kit as admin_app / client_app)
  forui: ^0.19.0

  # State Management
  flutter_riverpod: ^3.1.0
  firebase_core: ^4.4.0
  firebase_crashlytics: ^5.0.7

  # Navigation
  go_router: ^17.0.1

  # HTTP Client
  dio: ^5.4.0

  # Authentication (token storage)
  flutter_secure_storage: ^10.0.0

  # UI Components
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Utils
  intl: any
  shared_preferences: ^2.2.2
  # The tenant's logo, kept on disk for printing
  path_provider: ^2.1.0
  equatable: ^2.0.5
  uuid: ^4.3.3
  collection: ^1.18.0

  # SignalR (realtime updates)
  signalr_netcore: ^1.3.7

  # A till screen stays on all day
  wakelock_plus: ^1.2.10

  # New-order chime (the same file the other apps ship)
  audioplayers: ^6.1.0

  # Native Splash
  flutter_native_splash: ^2.4.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/sounds/

  # Inter + Cairo, the pair pos_web loads from Google Fonts, bundled as
  # static instances (weights 400/500/600/700 cover shadcn's
  # font-normal/medium/semibold/bold).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

# App icon configuration (same cup art as the other apps)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/cup_ios_inverted.png"
  adaptive_icon_background: "#18181B"
  adaptive_icon_foreground: "assets/images/cup_padded_white.png"
  min_sdk_android: 21

# Splash screen configuration
flutter_native_splash:
  color: "#18181B"
  image: assets/images/cup_splash_white.png

  fullscreen: true

  android_12:
    color: "#18181B"
    image: assets/images/cup_splash_white.png
