# The platform on a laptop: the same shape as ../docker-compose.yml, under
# *.localhost (browsers resolve any *.localhost to this machine, several
# labels deep, with no hosts-file entry) with Caddy's local CA for TLS. Images are built
# here, not pulled; the control plane runs in Docker and stamps tenants
# through the host's daemon.
#
#   ./build-images.ps1        (once, and after code changes)
#   docker compose up -d      (project: ninja-local)
#   https://control.localhost platform / Local123$   (trust the CA first, see README)
#
# Hosts a tenant gets: https://cove.localhost, https://admin.cove.localhost,
# https://pos.cove.localhost, https://kds.cove.localhost, https://api.cove.localhost

name: ninja-local

services:
  postgres:
    image: docker.io/ankane/pgvector:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local
      POSTGRES_MULTIPLE_DATABASES: keycloak,controldb
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
    networks: [ninja-local]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  eventbus:
    image: docker.io/library/rabbitmq:4.2
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: local
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [ninja-local]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_FEATURES: token-exchange,admin-fine-grained-authz:v1
      KC_HOSTNAME: https://auth.localhost
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: local
    volumes:
      - ./realms:/opt/keycloak/data/import:ro
      # The login theme every realm uses, straight from the repo
      - ../../../src/Ninja.AppHost/KeycloakConfiguration/themes/ninja:/opt/keycloak/themes/ninja:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ninja-local]

  control-api:
    build:
      context: ../../..
      dockerfile: src/Control.API/Dockerfile
    image: ninja-control:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "8080"
      ConnectionStrings__controldb: Host=postgres;Port=5432;Username=postgres;Password=local;Database=controldb
      Identity__Url: http://keycloak:8080/realms/ninja
      Keycloak__Realm: ninja
      Platform__Domain: localhost
      Platform__Scheme: https
      Platform__ControlUrl: https://control.localhost
      Platform__TenantsRoot: /opt/ninja/tenants
      Platform__ImageRegistry: ninja
      Platform__DefaultImageTag: local
      Platform__PullImages: "false"
      Platform__Network: ninja-local
      Platform__PostgresPassword: local
      Platform__RabbitPassword: local
      Platform__RabbitContainer: ninja-local-eventbus-1
      Platform__EdgeContainer: ninja-local-caddy-1
      Platform__PostgresContainer: ninja-local-postgres-1
      Platform__EdgeSnippetPath: /opt/ninja/platform/custom-domains.caddy
      Platform__KeycloakPublicUrl: https://auth.localhost
      Platform__KeycloakAdminPassword: local
      Platform__DemoDays: "14"
      # Backups go off the box into MinIO below, the laptop's stand-in for a bucket
      Platform__Offsite__Endpoint: http://minio:9000
      Platform__Offsite__Bucket: ninja-backups
      Platform__Offsite__AccessKey: minioadmin
      Platform__Offsite__SecretKey: minioadmin
      Platform__Offsite__Region: auto
      # Every mail lands in Mailpit at http://localhost:8025
      Platform__Mail__Host: mailpit
      Platform__Mail__Port: "1025"
      Platform__Mail__UseStartTls: "false"
      Platform__Mail__From: no-reply@localhost
      Platform__Mail__OpsTo: ops@localhost
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - tenants:/opt/ninja/tenants
      - ./custom-domains.caddy:/opt/ninja/platform/custom-domains.caddy
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks: [ninja-local]

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - ./custom-domains.caddy:/etc/caddy/custom-domains.caddy:ro
      - ./web/admin-web:/srv/admin-web:ro
      - ./web/client-web:/srv/client-web:ro
      - ./web/pos-web:/srv/pos-web:ro
      - ./web/kds-web:/srv/kds-web:ro
      - ./web/control-web:/srv/control-web:ro
      - ../apps:/srv/apps:ro
    depends_on:
      - control-api
    networks: [ninja-local]

  # Every mail the platform (and the realms) send, caught at http://localhost:8025
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
    networks: [ninja-local]

  # An S3-compatible bucket on the laptop, so the offsite copy of every backup can be watched at http://localhost:9001
  minio:
    # MinIO publishes to quay.io; the Docker Hub names stopped resolving
    image: quay.io/minio/minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks: [ninja-local]

  # The bucket exists before the control plane's first upload
  minio-bucket:
    image: quay.io/minio/mc
    entrypoint: ["/bin/sh", "-c", "until mc alias set local http://minio:9000 minioadmin minioadmin >/dev/null 2>&1; do sleep 1; done; mc mb -p local/ninja-backups"]
    depends_on: [minio]
    networks: [ninja-local]

networks:
  ninja-local:
    name: ninja-local
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data:
  tenants:
  caddy-data:
  minio-data:
